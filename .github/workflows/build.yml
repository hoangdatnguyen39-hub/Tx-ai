name: Build TX AI Overlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
          fi       - name: Fix Manifest Namespace
        run: |
          sed -i 's|http://android.com|http://android.com|g' app/src/main/AndroidManifest.xml
          sed -i 's|http://android.com|http://android.com|g' app/src/main/res/layout/layout_floating_bot.xml
          
          if [ -f "./gradlew" ]; then       - name: Fix Manifest Namespace
        run: |
          sed -i 's|http://android.com|http://android.com|g' app/src/main/AndroidManifest.xml
          sed -i 's|http://android.com|http://android.com|g' app/src/main/res/layout/layout_floating_bot.xml
          
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TX-AI-Overlay-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
